# Curriculum stage1 (warmup) variant of sft_8b_std_v1_md.yaml: trains 2 epochs on the
# subtask-decomposed med_flan_v1_md_sft_stage1_subtasks slice instead of the full
# med_flan_v1_md mix, starting from the base pretrained checkpoint. Only 1
# checkpoint is kept (save_total_limit) -- its output_dir becomes stage2's
# model_name_or_path. Judged only on its own dev-split loss, never scored via
# run_eval.py. See sft_8b_std_stage2_curriculum.yaml (the continuation) and sft_8b_std_v1_md.yaml
# (full rationale for the shared hyperparameters).
# Model arguments
# model_name_or_path: /project/models/Qwen3-8B
model_name_or_path: /project/models/Qwen3-8B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Qwen3 thinking mode: suppress reasoning. The chat template renders the assistant turn
# in Qwen3's empty-think-block no-think format (no reasoning content); setting
# enable_thinking: false additionally makes any generation-prompt rendering (generation
# eval / inference) insert the empty think block so the model answers directly.
enable_thinking: false

# Data training arguments
dataset_mixer:
  # /project/meddata/multitask/huggingface_format/med_flan: 1.0
  /project/med_flan/data/curriculum/med_flan_v1_md_sft_stage1_subtasks: 1.0
dataset_splits:
- train
- dev
preprocessing_num_workers: 8
dataloader_num_workers: 2
remove_unused_columns: true

# SFT trainer config
bf16: true
do_eval: true
eval_strategy: epoch
max_grad_norm: 1.0
gradient_checkpointing: false
log_level: info
logging_steps: 2
logging_strategy: steps
learning_rate: 1.0e-05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
optim: adamw_torch
optim_target_modules: all-linear
weight_decay: 0.01
max_seq_length: 32768
packing: false
dataset_num_proc: 16
max_steps: -1
num_train_epochs: 2
output_dir: /project/med_flan/models/curriculum/qwen_8b_std_stage1_1
overwrite_output_dir: true
per_device_eval_batch_size: 8
per_device_train_batch_size: 4 # this is per device; global batch = per device * gas * gpu * node
gradient_accumulation_steps: 1 # 1*4*4=16
push_to_hub: false
report_to:
- wandb
save_strategy: "epoch"
save_total_limit: 1
seed: 42
warmup_ratio: 0.05
completion_only_loss: true

# ─── Prompt loss weight ──────────────────────────────────────────────────────
use_plw: false
use_plw_sample_template: false # this is an inst model, so use the default chat template
prompt_loss_weight: 0.0

# FSDP2: Qwen3 is a standard dense decoder (no looped-activation memory
# multiplier like hrm_1b/ouro), so full-shard FSDP2 without CPU offload is
# enough on 4x GPUs. Activation checkpointing is FSDP-native (fsdp_config
# below) instead of HF's gradient_checkpointing -- transformers warns the
# latter adds a redundant AllGather in backward under FSDP (see
# huggingface/transformers#30404). Fall back to fsdp_config.cpu_offload: true
# if this OOMs at 8B.
fsdp: true
fsdp_config:
  version: 2
  transformer_layer_cls_to_wrap: Qwen3DecoderLayer
  reshard_after_forward: true
  activation_checkpointing: true
  cpu_ram_efficient_loading: true
  state_dict_type: SHARDED_STATE_DICT
